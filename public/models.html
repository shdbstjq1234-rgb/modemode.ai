<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>모델 선택 - ModeMode.ai</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            background: #0d0d0d;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        h1 {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 25px;
            font-size: 26px;
        }

        .model-grid {
            width: 100%;
            max-width: 430px;
            margin: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            min-height: 400px;
        }

        .model-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .model-box:hover {
            transform: scale(1.03);
            border-color: #5a4fff;
        }

        .model-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

<h1>모델 선택</h1>

<div class="model-grid" id="model-list"></div>

<!-- 🔥 app.js 절대경로로 교체 -->
<script src="/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadModels();
    });
</script>

</body>
</html>
