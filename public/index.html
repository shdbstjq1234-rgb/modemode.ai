<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>ModeMode.ai - 홈</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: white;
            font-family: 'Inter', sans-serif;
        }

        header {
            width: 100%;
            padding: 22px 0;
            background: #111;
            text-align: center;
            color: #eee;
            font-size: 22px;
            font-weight: bold;
            border-bottom: 1px solid #333;
        }

        .wrap {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 30px 22px;
        }

        h1 {
            font-size: 27px;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 35px;
            font-weight: 700;
        }

        .menu-box {
            background: #151515;
            border: 1px solid #333;
            border-radius: 14px;
            padding: 22px;
            margin-bottom: 18px;
            cursor: pointer;
            transition: 0.2s;
        }

        .menu-box:hover {
            border-color: #6d63ff;
            transform: scale(1.02);
        }

        .menu-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .menu-desc {
            font-size: 14px;
            opacity: 0.8;
        }

        .logout {
            width: 100%;
            padding: 14px;
            background: #5a4fff;
            border-radius: 10px;
            text-align: center;
            margin-top: 35px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>ModeMode.ai</header>

<div class="wrap">

    <h1>메뉴 선택</h1>

    <div class="menu-box" onclick="location.href='models.html'">
        <div class="menu-title">AI 패션 생성</div>
        <div class="menu-desc">모델과 의상을 선택해 AI 패션 이미지를 생성합니다.</div>
    </div>

    <div class="menu-box" onclick="location.href='my-images.html'">
        <div class="menu-title">내 생성 이미지</div>
        <div class="menu-desc">내가 생성한 이미지를 한 곳에서 모아보기</div>
    </div>

    <div class="menu-box" onclick="location.href='guide.html'">
        <div class="menu-title">사용 가이드</div>
        <div class="menu-desc">ModeMode.ai 기능 설명서</div>
    </div>

    <div class="logout" onclick="logout()">로그아웃</div>

</div>

<script>
function logout() {
    localStorage.removeItem("token");
    alert("로그아웃 되었습니다.");
    location.href = "login.html";
}

// 로그인 체크
if (!localStorage.getItem("token")) {
    location.href = "login.html";
}
</script>

</body>
</html>
